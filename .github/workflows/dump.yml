name: dump

# Watches Google's OTA listing and publishes a release for every supported
# Android version that has a build we have not dumped yet.
#
# The support window is whichever packages/a<N>.yaml files exist. Add a
# definition file and that version is covered; remove it and it is not.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Android major version (blank = every supported version)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the release is already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dump
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - id: plan
        name: Work out what needs dumping
        working-directory: tools
        run: |
          python3 plan_dumps.py \
            --packages ../packages \
            --index ../index.json \
            ${{ inputs.version && format('--only {0}', inputs.version) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            --github-output "$GITHUB_OUTPUT" > /dev/null

      - name: Report
        run: |
          if [ "${{ steps.plan.outputs.any }}" != "true" ]; then
            echo "::notice::every supported version is up to date"
          fi

  dump:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One release at a time: each needs ~30 GB of scratch, and they all push
      # to the same index and branch.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: "android ${{ matrix.major }} (${{ matrix.device }})"
    steps:
      - uses: actions/checkout@v4

      # An OTA zip plus its extracted images needs far more room than the
      # runner has by default.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction tools
        run: |
          pip install --quiet pyyaml
          sudo apt-get update -qq
          # liblzma-dev is not optional: payload-dumper-go depends on go-xz,
          # which is cgo and will not compile without lzma.h.
          sudo apt-get install -y -qq erofs-utils e2fsprogs liblzma-dev
          go install github.com/ssut/payload-dumper-go@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Verify tools
        run: python3 tools/extract.py --check-tools

      - name: Extract partitions
        run: |
          # --reclaim drops the zip, the payload and each image the moment it
          # has been consumed. Without it the peak is the OTA plus the payload
          # plus every image plus the tree, all alive at once, which a runner
          # does not have room for.
          python3 tools/extract.py \
            --url "${{ matrix.url }}" \
            --sha256 "${{ matrix.sha256 }}" \
            --work work --tree work/tree --reclaim
          rm -rf work/images work/payload.bin work/ota.zip
          df -h /

      - name: Check the dump matches the definitions
        run: |
          DEFS="packages/a${{ matrix.major }}.yaml"
          SDK=$(grep -h '^ro.build.version.sdk=' \
                work/tree/*/build.prop work/tree/*/etc/build.prop 2>/dev/null |
                head -n1 | cut -d= -f2)
          WANT=$(python3 -c "import yaml;print(yaml.safe_load(open('$DEFS'))['android']['api'])")
          if [ -n "$SDK" ] && [ "$SDK" != "$WANT" ]; then
            echo "::error::$DEFS declares API $WANT but the dump is API $SDK"
            exit 1
          fi

      - name: Build the manifest
        working-directory: tools
        run: |
          python3 build_manifest.py \
            --tree ../work/tree \
            --packages "../packages/a${{ matrix.major }}.yaml" \
            --assets ../out/assets \
            --out "../out/releases/${{ matrix.release_id }}/manifest.json" \
            --release "${{ matrix.release_id }}" \
            --device "${{ matrix.device }}" \
            --build "${{ matrix.build_id }}" \
            --image-url "${{ matrix.url }}" \
            --image-sha256 "${{ matrix.sha256 }}" \
            --asset-base "https://github.com/${{ github.repository }}/releases/download/${{ matrix.release_id }}" \
            --report "../out/releases/${{ matrix.release_id }}/unclaimed.txt"

      # The builder consumes this manifest, so let it be the judge.
      - name: Validate with the builder
        run: |
          go install github.com/306gapps/306gapps/cmd/306gapps@latest || {
            echo "::notice::builder not published yet; skipping cross-validation"
            exit 0
          }
          "$HOME/go/bin/306gapps" validate \
            "out/releases/${{ matrix.release_id }}/manifest.json"

      - name: Publish payloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ matrix.release_id }}
        run: |
          gh release create "$RELEASE" \
            --title "$RELEASE" \
            --notes "Dumped from ${{ matrix.device }} (${{ matrix.model }}) ${{ matrix.build_id }}.

          Source: ${{ matrix.url }}" \
            || echo "release exists, uploading into it"

          # Several gigabytes across a hundred-odd assets: a single transient
          # failure should not cost the whole dump. --clobber makes a retry
          # pick up where the last attempt stopped.
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE" out/assets/* --clobber; then
              echo "uploaded on attempt $attempt"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::upload failed after 3 attempts"
              exit 1
            fi
            echo "upload attempt $attempt failed; retrying"
            sleep 30
          done

          # Every payload the manifest names must actually be on the release,
          # or the builder will fail for users rather than here.
          python3 - <<'CHECK'
          import json, subprocess, sys
          m = json.load(open("out/releases/${{ matrix.release_id }}/manifest.json"))
          want = {f["asset"] for p in m["packages"] for f in p["files"] if f.get("asset")}
          have = set(subprocess.run(
              ["gh", "release", "view", "${{ matrix.release_id }}",
               "--json", "assets", "--jq", ".assets[].name"],
              capture_output=True, text=True, check=True).stdout.split())
          missing = want - have
          print(f"manifest names {len(want)} payloads; release carries {len(have)}")
          if missing:
              print(f"error: {len(missing)} payload(s) missing from the release:",
                    file=sys.stderr)
              for name in sorted(missing)[:10]:
                  print(f"  {name}", file=sys.stderr)
              sys.exit(1)
          CHECK

      - name: Commit the manifest to the Android version branch
        env:
          RELEASE: ${{ matrix.release_id }}
          BRANCH: a${{ matrix.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin "$BRANCH" 2>/dev/null; then
            git checkout "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p "releases/$RELEASE"
          cp "out/releases/$RELEASE/manifest.json" "releases/$RELEASE/"
          cp "out/releases/$RELEASE/unclaimed.txt" "releases/$RELEASE/" 2>/dev/null || true
          git add "releases/$RELEASE"
          git commit -m "add $RELEASE" || echo "nothing to commit"
          git push origin "$BRANCH"

      - name: Update the index on main
        env:
          RELEASE: ${{ matrix.release_id }}
          BRANCH: a${{ matrix.major }}
        run: |
          git checkout main
          git pull --rebase origin main
          python3 tools/publish_index.py \
            --index index.json \
            --manifest "out/releases/$RELEASE/manifest.json" \
            --repo "${{ github.repository }}" \
            --branch "$BRANCH" \
            --asset-base "https://github.com/${{ github.repository }}/releases/download/$RELEASE"
          git add index.json
          git commit -m "index: add $RELEASE" || echo "nothing to commit"
          git push origin main

      - name: Flag unclaimed apps
        run: |
          FILE="out/releases/${{ matrix.release_id }}/unclaimed.txt"
          CODE=$(grep -E '\.(apk|apex|capex|jar)$' "$FILE" 2>/dev/null |
                 grep -v '^system/' || true)
          if [ -n "$CODE" ]; then
            COUNT=$(echo "$CODE" | wc -l)
            echo "::warning::android ${{ matrix.major }}: $COUNT unclaimed file(s); see releases/${{ matrix.release_id }}/unclaimed.txt"
          fi
