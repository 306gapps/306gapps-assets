name: dump

# Watches Google's OTA listing and publishes a release for every supported
# Android version with a build we have not dumped. The support window is
# whichever packages/a<N>.yaml files exist.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Android major version (blank = every supported version)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the release is already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dump
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - id: plan
        name: Work out what needs dumping
        working-directory: tools
        run: |
          python3 plan_dumps.py \
            --packages ../packages \
            --index ../index.json \
            ${{ inputs.version && format('--only {0}', inputs.version) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            --github-output "$GITHUB_OUTPUT" > /dev/null

      - name: Report
        run: |
          if [ "${{ steps.plan.outputs.any }}" != "true" ]; then
            echo "::notice::every supported version is up to date"
          fi

  dump:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Each version runs on its own runner and writes only its own version
      # branch, GitHub release and R2 objects; the index is rebuilt once after.
      # Capped at 3: five at once can trip GitHub's secondary upload rate limit.
      max-parallel: 3
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: "android ${{ matrix.major }} (${{ matrix.device }})"
    env:
      # Ubuntu's 1.7.1 corrupts large files silently.
      EROFS_VERSION: "1.9.4"
    steps:
      - uses: actions/checkout@v4

      # An OTA plus its images needs more room than a runner has by default.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction tools
        run: |
          pip install --quiet pyyaml
          sudo apt-get update -qq
          # payload-dumper-go pulls in go-xz, which is cgo and needs lzma.h.
          sudo apt-get install -y -qq e2fsprogs liblzma-dev liblz4-dev \
            libzstd-dev zlib1g-dev uuid-dev autoconf automake libtool pkg-config
          go install github.com/ssut/payload-dumper-go@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Ubuntu ships erofs-utils 1.7.1, which truncates large files and still
      # exits zero -- it cut 24 KiB off a 148 MiB apex. Build 1.8 instead.
      - name: Build erofs-utils ${{ env.EROFS_VERSION }}
        run: |
          curl -fsSL -o erofs.tar.gz \
            "https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/erofs-utils-${EROFS_VERSION}.tar.gz"
          tar xzf erofs.tar.gz
          cd "erofs-utils-${EROFS_VERSION}"
          ./autogen.sh
          ./configure --prefix="$HOME/.local" \
            --enable-lz4 --enable-lzma --enable-zstd
          make -j"$(nproc)"
          make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/fsck.erofs" -V

      - name: Verify tools
        run: python3 tools/extract.py --check-tools

      - name: Extract partitions
        run: |
          # Without --reclaim the OTA, the payload, every image and the tree
          # are all alive at once, which does not fit on a runner.
          python3 tools/extract.py \
            --url "${{ matrix.url }}" \
            --sha256 "${{ matrix.sha256 }}" \
            --work work --tree work/tree --reclaim
          rm -rf work/images work/payload.bin work/ota.zip
          df -h /

      - name: Check the dump matches the definitions
        run: |
          DEFS="packages/a${{ matrix.major }}.yaml"
          SDK=$(grep -h '^ro.build.version.sdk=' \
                work/tree/*/build.prop work/tree/*/etc/build.prop 2>/dev/null |
                head -n1 | cut -d= -f2)
          WANT=$(python3 -c "import yaml;print(yaml.safe_load(open('$DEFS'))['android']['api'])")
          if [ -n "$SDK" ] && [ "$SDK" != "$WANT" ]; then
            echo "::error::$DEFS declares API $WANT but the dump is API $SDK"
            exit 1
          fi

      - name: Build the manifest
        working-directory: tools
        run: |
          python3 build_manifest.py \
            --tree ../work/tree \
            --packages "../packages/a${{ matrix.major }}.yaml" \
            --assets ../out/assets \
            --out "../out/releases/${{ matrix.release_id }}/manifest.json" \
            --release "${{ matrix.release_id }}" \
            --device "${{ matrix.device }}" \
            --build "${{ matrix.build_id }}" \
            --image-url "${{ matrix.url }}" \
            --image-sha256 "${{ matrix.sha256 }}" \
            --asset-base "https://github.com/${{ github.repository }}/releases/download/${{ matrix.release_id }}" \
            --report "../out/releases/${{ matrix.release_id }}/unclaimed.txt"

      # The builder consumes this manifest, so let it be the judge.
      - name: Validate with the builder
        run: |
          go install github.com/306gapps/306gapps/cmd/306gapps@latest || {
            echo "::notice::builder not published yet; skipping cross-validation"
            exit 0
          }
          "$HOME/go/bin/306gapps" validate \
            "out/releases/${{ matrix.release_id }}/manifest.json"

      - name: Publish payloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ matrix.release_id }}
        run: |
          gh release create "$RELEASE" \
            --title "$RELEASE" \
            --notes "Dumped from ${{ matrix.device }} (${{ matrix.model }}) ${{ matrix.build_id }}.

          Source: ${{ matrix.url }}" \
            || echo "release exists, uploading into it"

          # Content-addressed names mean an asset already on the release is
          # correct, so only ever ADD what is missing -- never --clobber, whose
          # delete-then-reupload loses data when a run is interrupted (e.g. rate
          # limited). The missing set is recomputed each attempt so retries
          # resume where the last stopped; long backoff rides out a 403.
          for sleep_for in 0 60 120 240 480; do
            [ "$sleep_for" != 0 ] && { echo "retrying in ${sleep_for}s"; sleep "$sleep_for"; }
            have=$(gh release view "$RELEASE" --json assets --jq '.assets[].name' 2>/dev/null || true)
            missing=()
            for f in out/assets/*; do
              grep -qxF "$(basename "$f")" <<<"$have" || missing+=("$f")
            done
            if [ "${#missing[@]}" -eq 0 ]; then echo "all assets present"; break; fi
            echo "uploading ${#missing[@]} missing asset(s)"
            gh release upload "$RELEASE" "${missing[@]}" || echo "upload incomplete, will retry"
          done

          # A payload missing here fails for users instead.
          python3 - <<'CHECK'
          import json, subprocess, sys
          m = json.load(open("out/releases/${{ matrix.release_id }}/manifest.json"))
          want = {f["asset"] for p in m["packages"] for f in p["files"] if f.get("asset")}
          have = set(subprocess.run(
              ["gh", "release", "view", "${{ matrix.release_id }}",
               "--json", "assets", "--jq", ".assets[].name"],
              capture_output=True, text=True, check=True).stdout.split())
          missing = want - have
          print(f"manifest names {len(want)} payloads; release carries {len(have)}")
          if missing:
              print(f"error: {len(missing)} payload(s) missing from the release:",
                    file=sys.stderr)
              for name in sorted(missing)[:10]:
                  print(f"  {name}", file=sys.stderr)
              sys.exit(1)

          # Only after the payloads above are confirmed present. A re-dump
          # that drops files otherwise leaves them on the release forever.
          stale = have - want
          for name in sorted(stale):
              print(f"pruning unreferenced asset {name}")
              subprocess.run(["gh", "release", "delete-asset",
                              "${{ matrix.release_id }}", name, "--yes"],
                             check=False)
          CHECK

      - name: Mirror payloads to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer aws-cli adds checksums R2 rejects; only send them when required.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # Public on purpose: a bucket name and a public domain, nothing hidden.
          R2_BUCKET: "306gapps"
        run: |
          # Either the full S3 endpoint or just the account id (endpoint built from it).
          endpoint="${R2_S3_ENDPOINT:-${R2_ACCOUNT_ID:+https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com}}"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$endpoint" ]; then
            echo "::notice::R2 endpoint/credentials not set; skipping mirror"
            exit 0
          fi
          # Best-effort: GitHub is the source of truth and the client's fallback,
          # so a mirror hiccup warns rather than blocking the publish.
          for attempt in 1 2 3; do
            # Flat, content-addressed names; --size-only since a name pins its bytes.
            if aws s3 sync out/assets "s3://$R2_BUCKET/" \
                 --endpoint-url "$endpoint" --size-only --no-progress; then
              exit 0
            fi
            echo "R2 sync attempt $attempt failed; retrying"; sleep 15
          done
          echo "::error::R2 mirror sync failed; assets are on GitHub, clients fall back"

      - name: Commit the manifest to the Android version branch
        env:
          RELEASE: ${{ matrix.release_id }}
          BRANCH: a${{ matrix.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The version branches are orphans, so main's files linger untracked
          # and every switch afterwards needs -f.
          if git fetch origin "$BRANCH" 2>/dev/null; then
            git checkout -f "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p "releases/$RELEASE"
          cp "out/releases/$RELEASE/manifest.json" "releases/$RELEASE/"
          cp "out/releases/$RELEASE/unclaimed.txt" "releases/$RELEASE/" 2>/dev/null || true
          git add "releases/$RELEASE"
          git commit -m "add $RELEASE" || echo "nothing to commit"
          git push origin "$BRANCH"

      - name: Flag unclaimed apps
        run: |
          FILE="out/releases/${{ matrix.release_id }}/unclaimed.txt"
          CODE=$(grep -E '\.(apk|apex|capex|jar)$' "$FILE" 2>/dev/null |
                 grep -v '^system/' || true)
          if [ -n "$CODE" ]; then
            COUNT=$(echo "$CODE" | wc -l)
            echo "::warning::android ${{ matrix.major }}: $COUNT unclaimed file(s); see releases/${{ matrix.release_id }}/unclaimed.txt"
          fi

  index:
    needs: [plan, dump]
    if: ${{ always() && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index.json from the version branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -f main
          git pull --rebase origin main
          python3 tools/rebuild_index.py \
            --repo "${{ github.repository }}" \
            --index index.json \
            --mirror-base "https://gapps.assets.306bobbyandroid.download"
          git add index.json
          git commit -m "index: rebuild after dump" || echo "nothing to commit"
          git push origin main
