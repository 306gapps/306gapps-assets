name: test

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Unit tests
        working-directory: tools
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Package definitions parse
        run: |
          for f in packages/*.yaml; do
            python3 -c "import yaml,sys;yaml.safe_load(open('$f'))" && echo "ok $f"
          done

      # A malformed workflow fails as a zero-second run with no useful log, so
      # catch it here instead.
      - name: Workflows are valid
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # The dump job spends 40 minutes downloading before it would notice a broken
  # toolchain, so prove the install works here in two.
  toolchain:
    runs-on: ubuntu-latest
    env:
      EROFS_VERSION: "1.9.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs liblzma-dev liblz4-dev \
            libzstd-dev zlib1g-dev uuid-dev autoconf automake libtool pkg-config
          go install github.com/ssut/payload-dumper-go@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build erofs-utils ${{ env.EROFS_VERSION }}
        run: |
          curl -fsSL -o erofs.tar.gz \
            "https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/erofs-utils-${EROFS_VERSION}.tar.gz"
          tar xzf erofs.tar.gz
          cd "erofs-utils-${EROFS_VERSION}"
          ./autogen.sh
          ./configure --prefix="$HOME/.local" --enable-lz4 --enable-lzma --enable-zstd
          make -j"$(nproc)"
          make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --check-tools fails on a version known to corrupt output, so this also
      # proves the build produced something new enough.
      - name: Every tool the dump needs is present and good enough
        run: python3 tools/extract.py --check-tools
