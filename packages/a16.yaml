# Package definitions for Android 16, derived from the Android 17 ones and
# corrected against a real dump of stallion (Pixel 10a) CP1A.260505.005.
#
# Globs use wildcards because directory names carry version suffixes that
# change every release. Run tools/suggest_globs.py when a package matches
# nothing: a wrong glob and an app this device does not ship look alike.

android:
  api: 36
  version: "16"
  codename: Baklava

# Deliberately not shipped; otherwise they bury the packages we have simply
# missed.
exclude:
  # Needs the Pixel camera HAL, and a stub signed with our key could never be
  # updated by Play. Left out so Play installs the build matching the device.
  - GoogleCamera

# Preset selections following NikGApps' editions, each building on the one
# before it. Tiers name packages rather than families because they cut across
# them: stock takes the Pixel launcher but not the wallpapers.
variants:
  - id: core
    name: Core
    summary: >-
      Play services, the Store, and the framework. The smallest thing that
      signs in and installs apps.
    packages: [gmscore, gsf, vending, syncadapters]

  - id: basic
    name: Basic
    includes: core
    summary: Core plus the phone, messaging and contacts apps.
    packages: [dialer, messages, contacts, carriersetup, clock, wellbeing]

  - id: omni
    name: Omni
    includes: basic
    summary: Basic plus setup, the keyboard, and the everyday Google apps.
    packages: [setupwizard, restore, gboard, calendar, keep, calculator,
               drive, maps, locationhistory, photos]

  - id: stock
    name: Stock
    includes: omni
    summary: What a Pixel ships with, near enough.
    packages: [gsa, gemini, pixellauncher, files, documentsui, storagemanager,
               recorder, markup, tts, sounds]

  - id: full
    name: Full
    includes: stock
    summary: Stock plus the rest of what NikGApps packages.
    packages: [gmail, feedback, partnersetup, devicepolicy, androidauto]

  - id: everything
    name: Everything
    summary: >-
      Every package in the release. Where two cannot coexist the first is
      taken, so this is a starting point rather than literally everything.
    all: true

# App families, in the order the picker shows them. A one-member family
# renders as a single row, a larger one as a tickable header.
groups:
  - id: core
    name: Core
    summary: Play services, the Store, and the framework everything else needs.
  - id: setup
    name: Setup Wizard
    summary: First-boot setup, restore, and the search engine chooser.
  - id: dialer
    name: Google Phone
  - id: messages
    name: Google Messages
  - id: contacts
    name: Google Contacts
  - id: gboard
    name: Gboard
  - id: tts
    name: Google Text-to-Speech
  - id: search
    name: Google Search
    summary: The Google app, Assistant, and Gemini.
  - id: chrome
    name: Google Chrome
    summary: Chrome, the WebView, and the Trichrome library they share.
  - id: files
    name: Google Files
    summary: Files by Google and the document picker it replaces AOSP's with.
  - id: photos
    name: Google Photos
  - id: markup
    name: Markup
  - id: gmail
    name: Gmail
  - id: maps
    name: Google Maps
  - id: locationhistory
    name: Location History
  - id: drive
    name: Google Drive
  - id: calendar
    name: Google Calendar
  - id: keep
    name: Google Keep
  - id: meet
    name: Google Meet
  - id: calculator
    name: Google Calculator
  - id: clock
    name: Google Clock
  - id: recorder
    name: Pixel Recorder
  - id: sounds
    name: Pixel Sounds
  - id: pixel
    name: Pixel Specifics
    summary: The launcher, wallpapers, themes, and the on-device AI that backs them.
  - id: wellbeing
    name: Digital Wellbeing
  - id: androidauto
    name: Android Auto
  - id: partnersetup
    name: Google Partner Setup
  - id: carrier
    name: Carrier Services
    summary: Carrier provisioning and eSIM support.
  - id: devicepolicy
    name: Android Device Policy
  - id: feedback
    name: Google Feedback
  - id: credentialmanager
    name: Credential Manager
  - id: findmydevice
    name: Find My Device
  - id: accessibility
    name: Accessibility
    summary: TalkBack and the other Google accessibility services.

packages:
  - id: gmscore
    name: Google Play services
    group: core
    required: true
    summary: >-
      Core Google services. Everything else depends on it. On Android 17
      the bulk of it ships as an apex, and the priv-app directory holds
      only the Chimera modules.
    package: com.google.android.gms
    include:
      - product/apex/com.google.android.gmssystem*.apex
      # The directory and its chimera modules carry release-codename suffixes
      # (PrebuiltGmsCoreSc, PrebuiltGmsCoreVic_*), so match the family.
      - product/priv-app/PrebuiltGmsCore*/**
      - product/etc/permissions/privapp-permissions-google*.xml
      # The allowlists are spread across product, system and system_ext;
      # GoogleServicesFramework and CarrierSetup are only in the system_ext
      # one. Under ro.control_privapp_permissions=enforce a missing entry
      # bootloops the device.
      - system/etc/permissions/privapp-permissions-google.xml
      - system_ext/etc/permissions/privapp-permissions-google-se.xml
      - product/etc/sysconfig/google.xml
      - product/etc/sysconfig/google_build.xml
      - product/etc/sysconfig/google-hiddenapi-package-whitelist.xml
      - product/etc/sysconfig/google-staged-installer-whitelist.xml
      - product/etc/sysconfig/google-install-constraints-package-allowlist.xml
      - product/etc/sysconfig/google-initial-package-stopped-states.xml
      - product/etc/sysconfig/google-system-apps-update-ownership.xml
      - product/etc/sysconfig/allowed_apex_com.google.android.gmssystem.xml
      - product/etc/default-permissions/default-permissions.xml

  - id: androidauto
    name: Android Auto
    group: androidauto
    requires: [gmscore]
    summary: >-
      A stub. Play installs the real Android Auto over it on first use,
      which is how a Pixel does it; the full app is not in the factory
      image to take.
    package: com.google.android.projection.gearhead
    include:
      - product/priv-app/AndroidAutoStubPrebuilt/**

  - id: gsf
    name: Google Services Framework
    group: core
    required: true
    summary: Device registration and push messaging.
    include:
      - system_ext/priv-app/GoogleServicesFramework/**

  - id: vending
    name: Google Play Store
    group: core
    default: true
    requires: [gmscore, gsf]
    summary: App store and Play Protect.
    include:
      - product/priv-app/Phonesky/**

  - id: verifier
    name: Play Protect verifier
    group: core
    requires: [gmscore]
    summary: >-
      Scans apps as they install. This is also the component Google's
      developer verification runs through. Leave it out to do without
      it, or take verifier-block to stop anything installing it later.
    include:
      - product/priv-app/VerifierPrebuiltClassic/**
      - product/etc/permissions/com.google.android.verifier.xml
      - product/etc/default-permissions/default-permissions-verifier.xml

  - id: verifier-block
    name: Block the developer verifier
    group: core
    conflicts: [verifier]
    summary: >-
      Stops the verifier ever being installed. It claims the package
      name with an empty apk signed by a key that was generated once and
      destroyed, and Android will not replace a package with one signed
      by a different key. Holds no code. Mutually exclusive with the
      verifier itself.
    package: com.google.android.verifier
    kang:
      - file: synth/VerifierBlocker.apk
        path: product/priv-app/VerifierBlocker/VerifierBlocker.apk
        synthetic: true

  - id: setupwizard
    name: Google Setup Wizard
    group: setup
    default: true
    requires: [gmscore, vending]
    summary: >-
      Replaces the ROM's first-boot flow. Needed to sign in during setup;
      without it you sign in from Settings afterwards.
    removes:
      - Provision
      - SetupWizard
      - LineageSetupWizard
    include:
      - product/priv-app/SetupWizardPrebuilt_*/**
      - system_ext/priv-app/SetupWizardPixelPrebuilt_*/**
      - product/overlay/PixelSetupWizardOverlay*.apk

  - id: restore
    name: Google Restore
    group: setup
    requires: [gmscore, setupwizard]
    summary: Restores apps and settings from a previous device during setup.
    include:
      - product/priv-app/GoogleRestorePrebuilt-*/**
      - product/priv-app/AndroidMigratePrebuilt/**

  - id: partnersetup
    name: Google Partner Setup
    group: partnersetup
    requires: [gmscore]
    include:
      - product/priv-app/PartnerSetupPrebuilt/**

  - id: searchselector
    name: Search engine selector
    group: setup
    requires: [gmscore]
    summary: The search engine choice screen shown during setup in the EEA.
    include:
      - product/priv-app/SearchSelectorPrebuilt/**
      - product/etc/permissions/com.google.android.apps.setupwizard.searchselector.xml

  - id: carriersetup
    name: Carrier Setup
    group: carrier
    include:
      - system_ext/priv-app/CarrierSetup/**

  - id: gsa
    name: Google app and Assistant
    group: search
    requires: [gmscore]
    summary: Search, Assistant and the at-a-glance widget. Large (~350 MB).
    removes:
      - QuickSearchBox
    include:
      - product/priv-app/Velvet/**
      - product/etc/permissions/velvet_app-privapp-permissions.xml

  - id: gemini
    name: Gemini
    group: search
    requires: [gmscore]
    include:
      - product/priv-app/GeminiShell_*/**
      - product/etc/sysconfig/gemini_experience.xml
      - product/etc/sysconfig/gemini_intelligence_device.xml

  - id: dialer
    name: Google Phone
    group: dialer
    requires: [gmscore]
    summary: Call screening and spam protection.
    removes:
      - Dialer
    include:
      - product/priv-app/GoogleDialer/**
      - product/etc/permissions/com.google.android.dialer.support.xml
      # Declared by the permissions xml; the dialer will not start without it.
      - product/framework/com.google.android.dialer.support.jar

  - id: messages
    name: Google Messages
    group: messages
    requires: [gmscore]
    summary: RCS-capable SMS client.
    removes:
      - messaging
      - Messaging
    include:
      - product/priv-app/PrebuiltBugle/**

  - id: contacts
    name: Google Contacts
    group: contacts
    requires: [gmscore]
    removes:
      - Contacts
    include:
      - product/app/GoogleContacts/**

  - id: gboard
    name: Gboard
    group: gboard
    requires: [gmscore]
    summary: >-
      Keyboard, including the offline speech and CJK models. Those live
      outside the app directory; without them voice typing only works
      online and Japanese, Korean and Chinese input is degraded.
    removes:
      - LatinIME
    include:
      - product/app/LatinIMEGooglePrebuilt*/**
      - product/usr/srec/**
      - product/usr/share/ime/**
      - product/lib/libjni_latinimegoogle.so
      - product/lib64/libjni_latinimegoogle.so

  - id: photos
    name: Google Photos
    group: photos
    requires: [gmscore]
    removes:
      - Gallery2
      - Glimpse
    include:
      - product/app/Photos/**

  - id: markup
    name: Markup
    group: markup
    summary: The annotation editor Photos and screenshots open.
    include:
      - product/app/MarkupGoogle*/**

  - id: calendar
    name: Google Calendar
    group: calendar
    requires: [gmscore]
    removes:
      - Calendar
      - Etar
    include:
      - product/app/CalendarGooglePrebuilt/**

  - id: trichrome
    name: Trichrome shared library
    group: chrome
    summary: >-
      Shared code Chrome and the Google WebView both need. Each declares
      it with uses-static-library and neither loads without it, so it is
      its own package rather than living inside either.
    package: com.google.android.trichromelibrary
    include:
      - product/app/TrichromeLibrary/**
      - product/app/TrichromeLibrary-Stub/**

  - id: chrome
    name: Chrome
    group: chrome
    requires: [gmscore, trichrome]
    removes:
      - Browser
      - Jelly
    include:
      - product/app/Chrome/**
      - product/app/Chrome-Stub/**

  - id: webview
    name: Google WebView
    group: chrome
    requires: [trichrome]
    removes:
      - webview
    include:
      - product/app/WebViewGoogle/**
      - product/app/WebViewGoogle-Stub/**

  - id: gmail
    name: Gmail
    group: gmail
    requires: [gmscore]
    include:
      - product/app/PrebuiltGmail/**

  - id: maps
    name: Google Maps
    group: maps
    requires: [gmscore]
    include:
      - product/app/Maps/**

  - id: drive
    name: Google Drive
    group: drive
    requires: [gmscore]
    include:
      - product/app/Drive/**

  - id: keep
    name: Google Keep
    group: keep
    requires: [gmscore]
    include:
      - product/app/GoogleKeepPrebuilt/**

  - id: meet
    name: Google Meet
    group: meet
    requires: [gmscore]
    include:
      - product/app/MeetPrebuilt_*/**

  - id: pixellauncher
    name: Pixel Launcher
    group: pixel
    requires: [gmscore]
    summary: Pixel home screen. Pair with gsa for the search bar.
    removes:
      - Launcher3
      - Launcher3QuickStep
      - Trebuchet
    include:
      - system_ext/priv-app/NexusLauncherRelease/**
      - system_ext/priv-app/WallpaperPickerGoogleRelease/**
      - system_ext/etc/permissions/com.google.android.apps.pixel.launcherconnector.xml

  - id: wallpapers
    name: Pixel wallpapers
    group: pixel
    include:
      - product/app/PixelWallpapers*/**

  - id: emojiwallpaper
    name: Emoji wallpaper
    group: pixel
    include:
      - product/app/WallpaperEmojiPrebuilt*/**

  - id: pixelthemes
    name: Pixel themes
    group: pixel
    include:
      - product/app/PixelThemesStub*/**

  - id: nowplaying
    name: Now Playing
    group: pixel
    requires: [gmscore]
    include:
      - product/app/NowPlayingPrebuilt/**
      - product/etc/default-permissions/default-permissions_nowplaying.xml

  - id: recorder
    name: Pixel Recorder
    group: recorder
    requires: [gmscore]
    removes:
      - Recorder
    include:
      - product/priv-app/RecorderPrebuilt*/**

  - id: aiai
    name: Device Personalization Services
    group: pixel
    requires: [gmscore]
    summary: >-
      On-device personalisation. App suggestions, smart text selection,
      Now Playing and Live Caption all route through it.
    include:
      - product/priv-app/DevicePersonalizationAiAiPrebuilt*/**

  - id: aicore
    name: AICore
    group: pixel
    requires: [gmscore]
    summary: On-device foundation models the newer Pixel features build on.
    include:
      - product/priv-app/AICorePrebuilt*/**

  - id: devicepolicy
    name: Android Device Policy
    group: devicepolicy
    requires: [gmscore]
    summary: Work profile and managed device support.
    include:
      - product/app/DevicePolicyPrebuilt*/**

  - id: credentialmanager
    name: Credential Manager
    group: credentialmanager
    requires: [gmscore]
    summary: Passkey and password autofill support.
    include:
      - product/app/CredentialManagerPrebuilt*/**

  - id: calculator
    name: Google Calculator
    group: calculator
    removes:
      - ExactCalculator
      - Calculator
    include:
      - product/app/CalculatorGooglePrebuilt*/**

  - id: clock
    name: Google Clock
    group: clock
    removes:
      - DeskClock
    include:
      - product/priv-app/PrebuiltDeskClockGoogle*/**

  - id: files
    name: Files by Google
    group: files
    requires: [gmscore]
    include:
      - product/priv-app/FilesPrebuilt/**

  - id: documentsui
    name: Google document picker
    group: files
    summary: >-
      Replaces the AOSP file picker. This is what every app opens when
      it asks you to choose a file.
    removes:
      - DocumentsUI
    include:
      - system/priv-app/DocumentsUIGoogle/**

  - id: storagemanager
    name: Google storage manager
    group: files
    removes:
      - StorageManager
    include:
      - system_ext/priv-app/StorageManagerGoogle/**

  - id: locationhistory
    name: Location History
    group: locationhistory
    requires: [gmscore]
    include:
      - product/app/LocationHistoryPrebuilt/**

  - id: feedback
    name: Google Feedback
    group: feedback
    requires: [gmscore]
    summary: Reports problems to Google. Harmless to leave out.
    include:
      - system_ext/priv-app/GoogleFeedback/**

  - id: syncadapters
    name: Contacts and Calendar sync adapters
    group: core
    requires: [gmscore]
    # Two apps in one selection, so both data directories must be cleared.
    package:
      - com.google.android.syncadapters.contacts
      - com.google.android.syncadapters.calendar
    summary: >-
      Legacy account sync adapters, off by default. No Pixel image since
      Android 13 ships them because Play services handles sync itself;
      offered for ROMs that still expect them.
    kang:
      - path: product/app/GoogleContactsSyncAdapter/GoogleContactsSyncAdapter.apk
        file: kang/GoogleContactsSyncAdapter.apk
      - path: product/app/GoogleCalendarSyncAdapter/GoogleCalendarSyncAdapter.apk
        file: kang/GoogleCalendarSyncAdapter.apk

  - id: sounds
    name: Pixel sounds
    group: sounds
    summary: >-
      Pixel ringtones, alarms and notification sounds. Includes the
      picker that exposes them.
    include:
      - product/media/audio/**
      - product/app/SoundPickerPrebuilt*/**
      - product/overlay/GoogleSounds*.apk

  - id: tts
    name: Google Text-to-Speech
    group: tts
    requires: [gmscore]
    summary: >-
      Text to speech, including the offline voice data. That lives
      outside the app directory; without it only languages downloaded on
      demand will speak.
    include:
      - product/app/GoogleTTS/**
      - product/tts/google/**

  - id: wellbeing
    name: Digital Wellbeing
    group: wellbeing
    requires: [gmscore]
    include:
      - product/priv-app/WellbeingPrebuilt/**

  - id: euicc
    name: eSIM support
    group: carrier
    requires: [gmscore]
    summary: Needed for eSIM provisioning on most carriers.
    include:
      - product/priv-app/EuiccGoogle/**
      - system_ext/priv-app/EuiccSupportPixel-*/**
      - system_ext/priv-app/EuiccSupportPixelPermissions/**
      - system_ext/priv-app/EuiccGoogleOverlay/**
      - system_ext/etc/permissions/com.google.euiccpixel*.xml

  - id: talkback
    name: TalkBack
    group: accessibility
    requires: [gmscore]
    summary: Screen reader. The one accessibility service most users need.
    include:
      - product/app/talkback/**
      - product/etc/default-permissions/default-permissions_talkback.xml

  - id: switchaccess
    name: Switch Access
    group: accessibility
    requires: [gmscore]
    summary: Control the device with switches rather than the touchscreen.
    include:
      - product/app/SwitchAccessPrebuilt*/**

  - id: voiceaccess
    name: Voice Access
    group: accessibility
    requires: [gmscore]
    summary: Control the device by voice.
    include:
      - product/app/VoiceAccessPrebuilt/**

  - id: soundamplifier
    name: Sound Amplifier
    group: accessibility
    requires: [gmscore]
    summary: Amplifies and filters audio through headphones.
    include:
      - product/app/SoundAmplifierPrebuilt*/**

  - id: findmydevice
    name: Find My Device
    group: findmydevice
    requires: [gmscore]
    include:
      - product/app/FindMyDevicePrebuilt-*/**

  - id: wallet
    name: Google Wallet quick access
    group: pixel
    requires: [gmscore]
    include:
      - system_ext/priv-app/QuickAccessWallet/**
